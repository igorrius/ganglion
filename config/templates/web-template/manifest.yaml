# yaml-language-server: $schema=../../../schemas/module-manifest.schema.json
name: web-template
version: 1
abi: 1
triggers:
  # The page's files and its data. Each module is served under its own prefix,
  # http://127.0.0.1:8090/<module>/, and a path below is the path inside it.
  # The template answers GET only; add a method here and a branch in
  # src/lib.rs `serve` together.
  - http:
      routes:
        - {path: /,         methods: [GET]}
        - {path: /app.js,   methods: [GET]}
        - {path: /app.css,  methods: [GET]}
        - {path: /api/data, methods: [GET]}
capabilities:
  state: true
cells:
  # The page reads these with cell_get; each must also be in LISTENED in src/logic.rs.
  read: [producer.value]
# Events the page keeps. `reading` feeds the chart's ring buffer; `notices` takes
# the notices of another module: link it from `<module>.notify`. Both need a
# link in the node's file before anything arrives.
ports:
  accepts:
    reading: {value: number}
    notices: {text: string, at: string}
config:
  title:      {type: string, default: "Readings"}
  max_points: {type: number, default: "288"}
  keep_hours: {type: number, default: "24"}
limits:
  memory: 16MiB
  timeout: 5s
escalate:
  - on: module.exception
