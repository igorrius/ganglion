[package]
name = "web-template"
version = "0.1.0"
edition = "2024"
description = "The web template: a module that serves a page on an edge's loopback (spec R-HTTP-4, R-HTTP-5)"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
