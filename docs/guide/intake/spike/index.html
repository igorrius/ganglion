<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>ganglion intake (spike)</title>
<style>
  :root { color-scheme: light dark; --fg: #1b1b1f; --bg: #ffffff; --muted: #5f6368; --box: #f1f3f4; --ok: #137333; --bad: #c5221f; }
  @media (prefers-color-scheme: dark) { :root { --fg: #e8eaed; --bg: #1b1b1f; --muted: #9aa0a6; --box: #2d2e31; --ok: #81c995; --bad: #f28b82; } }
  body { margin: 0; padding: 16px; font: 16px/1.45 system-ui, sans-serif; color: var(--fg); background: var(--bg); }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  p { margin: 8px 0; }
  .muted { color: var(--muted); font-size: 14px; }
  .line { font-family: ui-monospace, monospace; font-size: 13px; word-break: break-all; background: var(--box); padding: 10px; border-radius: 8px; margin: 10px 0; }
  button { font: inherit; padding: 10px 16px; border-radius: 8px; border: 0; background: #1a73e8; color: #fff; }
  input { font: inherit; width: 100%; box-sizing: border-box; padding: 10px; border-radius: 8px; border: 1px solid var(--muted); background: var(--bg); color: var(--fg); margin: 8px 0; }
  .ok { color: var(--ok); } .bad { color: var(--bad); }
  ul { padding-left: 20px; }
</style>
</head>
<body>
<main id="app"><h1>ganglion</h1><p class="muted">This page needs JavaScript.</p></main>
<script>
"use strict";
// Spike page for issue #255 (throwaway; the real page is intake/v1, #257).
// Mode "oauth": the sign-in server's redirect brings code, state (and iss) in
// the query; the page shows a gauth1 line to copy.
// Mode "secret": the node's link carries the request after "#"; the page seals
// the value with HPKE (RFC 9180, base mode, DHKEM(P-256, HKDF-SHA256),
// HKDF-SHA256, AES-128-GCM) and shows a gsec1 line to copy.
// Mode "check": no parameters; reports what this browser's WebCrypto can do.
// The page sends nothing over the network (connect-src 'none').

const app = document.getElementById("app");
const te = new TextEncoder();
const subtle = (self.crypto && self.crypto.subtle) || null;

function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") n.className = v; else if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v);
  }
  for (const c of kids) n.append(c);
  return n;
}
function b64u(bytes) {
  let s = ""; for (const b of bytes) s += String.fromCharCode(b);
  return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function unb64u(s) {
  s = s.replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "=";
  const bin = atob(s); const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
function cat(...parts) {
  const n = parts.reduce((a, p) => a + p.length, 0); const out = new Uint8Array(n); let o = 0;
  for (const p of parts) { out.set(p, o); o += p.length; }
  return out;
}
function i2osp(v, n) { const out = new Uint8Array(n); for (let i = n - 1; i >= 0; i--) { out[i] = v & 0xff; v >>= 8; } return out; }

async function copyLine(text, note) {
  try { await navigator.clipboard.writeText(text); note.textContent = "Copied. Paste it into the chat with the bot."; note.className = "ok"; }
  catch (e) { note.textContent = "Copying is not allowed here: select the line and copy it by hand."; note.className = "bad"; }
}
function showLine(title, line, hint) {
  const note = el("p", { class: "muted" }, hint);
  app.replaceChildren(
    el("h1", {}, title),
    el("div", { class: "line", id: "line" }, line),
    el("button", { onclick: () => copyLine(line, note) }, "Copy"),
    note,
  );
}

// HKDF-SHA256 from HMAC, so Extract and Expand can be called apart (RFC 5869).
async function hmac(key, data) {
  const k = await subtle.importKey("raw", key.length ? key : new Uint8Array(32), { name: "HMAC", hash: "SHA-256" }, false, ["sign"]);
  return new Uint8Array(await subtle.sign("HMAC", k, data));
}
const extract = (salt, ikm) => hmac(salt, ikm);
async function expand(prk, info, len) {
  if (len > 32) throw new Error("expand: one block only");
  return (await hmac(prk, cat(info, new Uint8Array([1])))).slice(0, len);
}
const V1 = te.encode("HPKE-v1");
const labeledExtract = (sid, salt, label, ikm) => extract(salt, cat(V1, sid, te.encode(label), ikm));
const labeledExpand = (sid, prk, label, info, len) => expand(prk, cat(i2osp(len, 2), V1, sid, te.encode(label), info), len);

const KEM = 0x0010, KDF = 0x0001, AEAD = 0x0001; // DHKEM(P-256, HKDF-SHA256), HKDF-SHA256, AES-128-GCM
const SID_KEM = cat(te.encode("KEM"), i2osp(KEM, 2));
const SID = cat(te.encode("HPKE"), i2osp(KEM, 2), i2osp(KDF, 2), i2osp(AEAD, 2));

// Seal returns enc || ciphertext, as Go's crypto/hpke.Seal does.
async function hpkeSeal(pkR, info, plaintext) {
  const pubR = await subtle.importKey("raw", pkR, { name: "ECDH", namedCurve: "P-256" }, false, []);
  const eph = await subtle.generateKey({ name: "ECDH", namedCurve: "P-256" }, true, ["deriveBits"]);
  const dh = new Uint8Array(await subtle.deriveBits({ name: "ECDH", public: pubR }, eph.privateKey, 256));
  const enc = new Uint8Array(await subtle.exportKey("raw", eph.publicKey));
  const kemContext = cat(enc, pkR);
  const eaePrk = await labeledExtract(SID_KEM, new Uint8Array(0), "eae_prk", dh);
  const shared = await labeledExpand(SID_KEM, eaePrk, "shared_secret", kemContext, 32);
  const pskIdHash = await labeledExtract(SID, new Uint8Array(0), "psk_id_hash", new Uint8Array(0));
  const infoHash = await labeledExtract(SID, new Uint8Array(0), "info_hash", info);
  const ksc = cat(new Uint8Array([0]), pskIdHash, infoHash);
  const secret = await labeledExtract(SID, shared, "secret", new Uint8Array(0));
  const key = await labeledExpand(SID, secret, "key", ksc, 16);
  const nonce = await labeledExpand(SID, secret, "base_nonce", ksc, 12);
  const k = await subtle.importKey("raw", key, { name: "AES-GCM" }, false, ["encrypt"]);
  const ct = new Uint8Array(await subtle.encrypt({ name: "AES-GCM", iv: nonce }, k, plaintext));
  return cat(enc, ct);
}

function oauthMode(q) {
  const code = q.get("code"), state = q.get("state"), iss = q.get("iss") || "";
  const err = q.get("error");
  if (err) { app.replaceChildren(el("h1", {}, "Sign-in failed"), el("p", {}, "The sign-in server said: " + err), el("p", { class: "muted" }, "Go back to the chat and press Sign in again.")); return; }
  if (!/^[A-Za-z0-9._~-]{1,512}$/.test(code || "") || !/^[A-Za-z0-9_-]{16,64}$/.test(state || "")) {
    app.replaceChildren(el("h1", {}, "This link is not complete"), el("p", { class: "muted" }, "Go back to the chat and press Sign in again.")); return;
  }
  const line = "gauth1." + state + "." + code + (iss ? "." + b64u(te.encode(iss)) : "");
  showLine("Signed in", line, "Copy this line and paste it into the chat with the bot. It works once, for 10 minutes.");
}

function secretMode(f) {
  const id = f.get("id"), name = f.get("name") || "", host = f.get("host") || "", pk = f.get("pk") || "";
  let pkR;
  try { pkR = unb64u(pk); } catch (e) { pkR = null; }
  if (f.get("v") !== "1" || !/^[A-Za-z0-9_-]{16,64}$/.test(id || "") || !pkR || pkR.length !== 65 || pkR[0] !== 4) {
    app.replaceChildren(el("h1", {}, "This link is not complete"), el("p", { class: "muted" }, "Go back to the chat and ask again.")); return;
  }
  const input = el("input", { type: "password", autocomplete: "off", autocapitalize: "off", spellcheck: "false", "aria-label": "Value" });
  const note = el("p", { class: "muted" }, "");
  const go = async () => {
    const value = te.encode(input.value);
    if (!value.length) { note.textContent = "The value is empty."; return; }
    if (value.length > 2048) { note.textContent = "The value is longer than 2 KB; set it on the host with ganglion secret set."; return; }
    try {
      const info = cat(te.encode("ganglion-intake-v1"), new Uint8Array([0]), te.encode(id), new Uint8Array([0]), te.encode(name));
      const sealed = await hpkeSeal(pkR, info, value);
      input.value = "";
      showLine("Sealed", "gsec1." + id + "." + b64u(sealed), "Copy this line and paste it into the chat with the bot. Only the node that asked can open it.");
    } catch (e) { note.textContent = "This browser could not seal the value: " + e.message; note.className = "bad"; }
  };
  app.replaceChildren(
    el("h1", {}, "Secret " + name),
    el("p", {}, "The value goes only to " + host + "."),
    el("p", { class: "muted" }, "It is encrypted on this phone; the page sends nothing anywhere."),
    input, el("button", { onclick: go }, "Seal"), note,
  );
}

async function checkMode() {
  const rows = [];
  const add = (name, ok, extra) => rows.push(el("li", {}, el("span", { class: ok ? "ok" : "bad" }, ok ? "yes " : "no "), name + (extra ? " — " + extra : "")));
  add("window.crypto.subtle", !!subtle, self.isSecureContext ? "secure context" : "NOT a secure context");
  if (subtle) {
    try { await subtle.generateKey({ name: "ECDH", namedCurve: "P-256" }, true, ["deriveBits"]); add("ECDH P-256", true); } catch (e) { add("ECDH P-256", false, e.name); }
    try { await subtle.generateKey({ name: "X25519" }, true, ["deriveBits"]); add("X25519", true); } catch (e) { add("X25519", false, e.name); }
    try { await hmac(new Uint8Array(0), new Uint8Array(1)); add("HMAC-SHA256", true); } catch (e) { add("HMAC-SHA256", false, e.name); }
    try { await subtle.importKey("raw", new Uint8Array(16), { name: "AES-GCM" }, false, ["encrypt"]); add("AES-GCM", true); } catch (e) { add("AES-GCM", false, e.name); }
    try {
      const r = await subtle.generateKey({ name: "ECDH", namedCurve: "P-256" }, true, ["deriveBits"]);
      const pk = new Uint8Array(await subtle.exportKey("raw", r.publicKey));
      const s = await hpkeSeal(pk, te.encode("check"), te.encode("hello"));
      add("HPKE seal", s.length === 65 + 5 + 16, s.length + " bytes");
    } catch (e) { add("HPKE seal", false, e.name + ": " + e.message); }
  }
  add("navigator.clipboard", !!(navigator.clipboard && navigator.clipboard.writeText));
  app.replaceChildren(
    el("h1", {}, "Browser check"),
    el("ul", {}, ...rows),
    el("p", { class: "muted" }, navigator.userAgent),
    el("p", { class: "muted" }, "Send a screenshot of this page to whoever asked you to open it."),
  );
}

const q = new URLSearchParams(location.search);
const f = new URLSearchParams(location.hash.slice(1));
if (q.has("code") || q.has("error")) oauthMode(q);
else if (f.get("mode") === "secret") secretMode(f);
else checkMode();
</script>
</body>
</html>
