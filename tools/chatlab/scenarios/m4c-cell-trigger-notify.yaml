# yaml-language-server: $schema=../../../schemas/chatlab-scenario.schema.json
name: m4c-cell-trigger-notify
why: >-
  M4c check 1 (R-RUN-15, R-RUN-16): a producer's cron run that writes a cell starts its listener, and the
  listener's notify reaches the owner with the node's note in history, without the module's text; no model turn
  is spent on any of it (proved by model_calls: 0, the node's count of calls to any model).
covers:
  - modhost/**
  - config/modhost.go
  - agent/module_event.go
  - agent/module_notify.go
  - agent/module_trigger.go
  - schedule/**
repeat: 1
model: scripted
modules:
  - {name: producer, manifest: modules/producer.yaml}
  - {name: listener, manifest: modules/listener.yaml}
script:
  # Never played: the scripted model is not to be called (model_calls: 0 proves it); the loader needs a script.
  - {say: "No model turn should happen."}
steps:
  - advance: {scheduler: 31m}
  - facts:
      replies: 1
      reply: {contains: "the reading changed"}
      history: {contains: "[module] listener notified you at", not_contains: "the reading changed"}
      model_calls: 0
