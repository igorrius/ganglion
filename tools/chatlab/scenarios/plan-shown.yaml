# yaml-language-server: $schema=../../../schemas/chatlab-scenario.schema.json
name: plan-shown
why: >-
  R-LIVE-8. Work with several steps shows one plan message with ticks: a plan delivered
  with the reply, or none at all, tells the person nothing while the work goes on.
covers:
  - plan/**
  - tool/builtin/plan.go
pages:
  - {url: "http://solar-notes.example.net/tips", file: pages/tips.html}
steps:
  - say: >-
      This takes several steps, so show me a plan first. Read
      http://solar-notes.example.net/tips, then read it again to check nothing changed,
      then remember in your memory that the page has five tips, and tell me when it is done.
  - reach: {journal: {tool: plan.show}, nudge: "Please show the plan with your plan tool and do the work."}
  - facts:
      journal:
        - {tool: plan.show}
      message_replaced: "✅"
