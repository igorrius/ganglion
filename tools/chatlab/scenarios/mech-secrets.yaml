# yaml-language-server: $schema=../../../schemas/chatlab-scenario.schema.json
name: mech-secrets
why: >-
  R-CFG-9: /secrets answers an admin in the private chat with no model and no
  note in the history, through the real core and the Bot API; a fresh node
  stores nothing and says how a secret is set on the host. A wrong word after
  it gets the usage and changes nothing.
covers:
  - agent/secrets_cmd.go
  - config/secrets.go
model: scripted
script:
  - {say: Hello.}
steps:
  - say: "hi"
  - say: "/secrets"
  - facts:
      reply: {contains: "No secrets are stored"}
      history: {not_contains: "/secrets"}
  - facts:
      reply: {contains: "ganglion secret set"}
  - say: "/secrets show"
  - facts:
      reply: {contains: "Usage: /secrets"}
