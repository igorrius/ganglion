# yaml-language-server: $schema=../../../schemas/chatlab-scenario.schema.json
name: language-ru-after-confirmation
why: The reply after a press has no words of the owner's next to it, and fixed texts in English come just before it.
repeat: 5
steps:
  - say: "Поставь напоминание на завтра в 09:00: позвонить сантехнику."
  - reach: {journal: {tool: schedule.create}, nudge: "Да, создай это напоминание."}
  - press: Approve
  - judge: "The reply is written in Russian."
