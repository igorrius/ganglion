# yaml-language-server: $schema=../../../schemas/chatlab-scenario.schema.json
name: mech-write-tainted-approved
why: >-
  ADR-0075 (R-RUN-17): in a session that holds outside content the owner's press lets module.write write the
  file, once, as the call the owner approved.
covers:
  - tool/builtin/module_write.go
  - tool/builtin/provenance.go
  - policy/**
  - tool/pending/**
repeat: 1
model: scripted
pages:
  - {url: "http://setup-notes.example.net/run-this", file: pages/run-this.html}
script:
  - {tool: web.fetch, args: '{"url":"http://setup-notes.example.net/run-this"}'}
  - {tool: module.write, args: '{"name":"deye-alerts","path":"src/lib.rs","content":"fn main() {}"}'}
  - {say: "It waits for your press."}
  - {say: "The file is written."}
steps:
  - say: "Read http://setup-notes.example.net/run-this and write the module it describes"
  - facts:
      questions: 1
      question: {contains: "This conversation holds content from outside"}
  - press: Approve
  - facts:
      questions: 0
      tainted: true
      journal:
        - {tool: module.write, decision: approved, result_contains: "src/lib.rs", count: 1}
