# yaml-language-server: $schema=../../../schemas/chatlab-scenario.schema.json
name: language-uk-task
why: >-
  In make accept on Sonnet an English task answered in Ukrainian, the language of
  the page it read. A task's answer must come in the language of the person who
  asked for it, whatever the page's.
repeat: 5
pages:
  - {url: "http://rates.example.net/today", file: pages/rates-en.html}
steps:
  - say: "Щогодини надсилай мені курс долара та євро зі сторінки http://rates.example.net/today, поки я не скасую."
  - reach: {journal: {tool: schedule.create}, nudge: "Так, створи це завдання."}
  - press: Approve
  - advance: {scheduler: 2h}
  - reach: {journal: {tool: web.fetch}}
  - judge: "The reply is written in Ukrainian. Numbers, currency codes, symbols and a phrase quoted from a page do not count."
