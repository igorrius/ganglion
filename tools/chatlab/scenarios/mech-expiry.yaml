# yaml-language-server: $schema=../../../schemas/chatlab-scenario.schema.json
name: mech-expiry
why: >-
  A question nobody answered kept its dead buttons until someone pressed one, and
  the call must never run after it expires.
covers:
  - agent/resume.go
  - agent/turn.go
  - tool/pending/**
  - outbox/**
  - queue/sqlqueue/outbox.go
  - transport/telegram/transport.go
  - transport/telegram/buttons.go
  - transport/telegram/split.go
model: scripted
script:
  - {tool: schedule.create, args: '{"kind":"reminder","at":"2099-01-01 09:00","text":"Call the plumber."}'}
  - {say: I asked.}
  - {say: It expired.}
steps:
  - say: "Remind me to call the plumber."
  - facts:
      questions: 1
  - advance: {confirmations: 16m}
  - facts:
      journal:
        - {tool: schedule.create, decision: expired}
      no_journal:
        - {tool: schedule.create, decision: approved}
      jobs: {kind: reminder, count: 0}
      message_replaced: "Expired, "
      questions: 0
