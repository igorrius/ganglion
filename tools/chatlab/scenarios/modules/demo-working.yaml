name: demo-reader
version: 1
triggers:
  - cron: "*/30 * * * *"
  - tool: status
    about: "Battery state of charge of the inverter."
    output: {ok: boolean, value: integer, at_ms: integer}
cells:
  report:
    soc: {kind: sensor, type: integer, about: "Battery state of charge, %"}
config:
  op_cron: {type: string, default: '{"op":"cell_report","name":"soc","json":87}'}
  op_tool_status: {type: string, default: '{"op":"cell_get","name":"soc"}'}
escalate:
  - on: auth_failed
