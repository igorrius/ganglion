# yaml-language-server: $schema=../../../schemas/chatlab-scenario.schema.json
name: skill-script-change
why: A script skill that changes something must ask first, run once when approved, and its output must reach the owner.
covers:
  - "skills/**"
  - tool/builtin/skill.go
  - agent/skills.go
  - "policy/**"
  - "tool/pending/**"
skills: [skills/stamp-log]
steps:
  - say: "Run the stamp-log skill and tell me exactly what it printed."
  - reach: {journal: {tool: skill.stamp_log, decision: confirm}, nudge: "Please run the stamp-log skill now."}
  - facts:
      questions: 1
      no_journal:
        - {tool: skill.stamp_log, decision: approved}
  - press: Approve
  - facts:
      journal:
        - {tool: skill.stamp_log, decision: approved, result_contains: "log stamped marker 8842", count: 1}
      questions: 0
      reply: {contains: "8842"}
