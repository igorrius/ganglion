[package]
name = "deye-reader"
version = "0.1.0"
edition = "2024"
description = "deye-reader module in Rust, for the ADR-0011 comparison (own ABI and Extism)"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
own = []
extism = ["dep:extism-pdk"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
base64 = "0.23"
extism-pdk = { version = "1.4.1", optional = true }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
