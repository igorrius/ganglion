[package]
name = "html2md"
version = "0.1.0"
edition = "2024"
description = "html2md module: the main content of a web page as Markdown (ADR-0035)"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# Releases at least two weeks old when chosen (ADR-0035); Cargo.lock pins
# the rest.
[dependencies]
dom_query = "=0.28.0"
htmd = "=0.5.6"
# The parser dom_query uses (0.39.0, already in Cargo.lock), for the depth
# gate's own sink.
html5ever = "=0.39.0"
memchr = "=2.8.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Host builds (cargo test, clippy, examples) are a cache, not something we
# debug in a debugger: without debug info and incremental state they take
# a fraction of the disk (`make clean-modules` drops them all).
[profile.dev]
debug = 0
incremental = false

# Tests parse thousands of pages (tests/depth.rs): unoptimised, the
# property tests take 144 s instead of 11 s.
[profile.test]
opt-level = 2
