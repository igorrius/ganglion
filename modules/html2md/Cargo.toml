[package]
name = "html2md"
version = "0.1.0"
edition = "2024"
description = "html2md module: the main content of a web page as Markdown (ADR-0035)"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# Releases at least two weeks old when chosen (ADR-0035); Cargo.lock pins
# the rest.
[dependencies]
dom_query = "=0.28.0"
htmd = "=0.5.6"
memchr = "=2.8.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
