# Manifest of the deye-reader module (docs/spec.md, sections 7.5 and 8.3).
# Copy it and set config.inverter_sn to your inverter's serial number.
name: deye-reader
version: 1
triggers:
  - cron: "*/30 * * * *"
  - tool: deye.status
capabilities:
  http.fetch: [eu1-developer.deyecloud.com]
  secret.get: [DEYE_APP_ID, DEYE_APP_SECRET, DEYE_EMAIL, DEYE_PASSWORD]
  state: true
config:
  inverter_sn: ""
limits:
  memory: 32MiB
  timeout: 20s
escalate:
  - on: module.exception
  - on: auth_failed
