# yaml-language-server: $schema=../../schemas/module-manifest.schema.json
# Manifest of the deye-reader module (docs/spec.md, sections 7.5 and 8.3).
# The inverter serial number is the required config key inverter_sn.
name: deye-reader
version: 1
triggers:
  - cron: "*/30 * * * *"
  - tool: status
    about: Battery, grid and load now.
    output: {soc: integer}
capabilities:
  http.fetch: [eu1-developer.deyecloud.com]
  secret.get: [DEYE_APP_ID, DEYE_APP_SECRET, DEYE_EMAIL, DEYE_PASSWORD]
  state: true
config:
  inverter_sn: {type: string, required: true}
limits:
  memory: 32MiB
  timeout: 20s
escalate:
  - on: module.exception
  - on: auth_failed
