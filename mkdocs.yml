# The documentation site: the user guide in docs/guide/ (ADR-0085), built by
# Zensical (ADR-0084) and published on GitHub Pages by
# .github/workflows/docs.yml. The engineering record in the rest of docs/
# is read on GitHub, not published here.
site_name: ganglion
site_description: A self-hosted agent that talks to you in Telegram, remembers, and builds its own automations
site_url: https://igorrius.github.io/ganglion/
repo_url: https://github.com/igorrius/ganglion
repo_name: igorrius/ganglion
edit_uri: edit/master/docs/guide/
copyright: Apache-2.0
docs_dir: docs/guide
site_dir: site

nav:
  - Home: index.md
  - Getting started:
      - Requirements: getting-started/requirements.md
      - Install: getting-started/install.md
      - Configure: getting-started/configure.md
      - First conversation: getting-started/first-conversation.md
  - Using ganglion:
      - Talking to the agent: using/talking.md
      - Commands: using/commands.md
      - Settings from the chat: using/settings.md
      - Memory and reminders: using/memory.md
      - Modules and reflexes: using/modules.md
      - Entering a secret: using/secrets.md
      - Tools and safety: using/tools-and-safety.md
      - Connecting an MCP server: using/mcp.md
  - Running a node:
      - Configuration reference: running/configuration.md
      - Models and providers: running/models.md
      - "Telegram: polling or webhook": running/telegram-updates.md
      - Operations: running/operations.md
      - Deploying on Railway: running/railway.md
  - Troubleshooting: troubleshooting.md
  - For contributors: contributors.md

theme:
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.footer
    - navigation.top
    - navigation.indexes
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Light mode

markdown_extensions:
  - tables
  - admonition
  - toc:
      permalink: true
      # Heading anchors exactly as GitHub makes them, so a link to a heading
      # works on GitHub and on the site alike.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

