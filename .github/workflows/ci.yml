name: CI

# Documentation-only changes do not build or test: no Go code reads
# Markdown or anything under docs/. A push to master skips the workflow for
# them. A pull request always starts it, because master requires the "ci"
# job below and a workflow that never starts leaves a required check waiting
# for ever; the "changes" job then skips the work.
on:
  push:
    branches: [master]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
  # A run by hand (gh workflow run CI --ref <branch>) tests everything again; see
  # the test job.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Says whether anything but documentation changed. Only a pull request can
  # say no: a push with documentation alone never starts the workflow.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          # A pull request is checked out as its merge commit, whose first
          # parent is the base branch.
          fetch-depth: 2
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          code=true
          if [ "$EVENT" = pull_request ]; then
            if ! git diff --name-only HEAD^1 HEAD | grep -qvE '(\.md$|^docs/)'; then
              code=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  # Only tests whose inputs changed run: go test reuses the rest from the cache
  # (docs/conventions.md, Tests). GitHub scopes a cache to its branch, so a pull
  # request reads master's results and its own, and master never reads a pull
  # request's.
  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # The longest part, the chatlab scenarios, runs beside the rest instead of
    # after it; the job's time is the slowest part's.
    strategy:
      fail-fast: false
      matrix:
        part: [unit, chatlab, network]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # Its key is shared with the other jobs and changes only with go.sum,
          # so the job that ends first wins it, and this one ends last.
          cache: false
      - name: Restore the Go cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-test-${{ runner.os }}-${{ matrix.part }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: go-test-${{ runner.os }}-${{ matrix.part }}-
      - name: File times follow file contents
        run: scripts/pin-file-times.sh
      - name: A run by hand reuses no result
        if: github.event_name == 'workflow_dispatch'
        run: go clean -testcache
      # The module tests build Rust to wasm32-wasip1 and skip without it.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: wasm32-wasip1
      - name: Build
        if: matrix.part == 'unit'
        run: go build ./...
      - name: Vet
        if: matrix.part == 'unit'
        run: go vet ./...
      - name: Test
        if: matrix.part == 'unit'
        run: go test -race ./...
      - name: Chatlab scenarios
        if: matrix.part == 'chatlab'
        run: go test -race -timeout 20m -tags lab ./internal/chatlab/... ./tools/chatlab/...
      # The intake page's own script seals a value and makes an OAuth line
      # under Node.js's WebCrypto, afresh on every run; Go opens and parses
      # them (R-INT-4). The committed fixtures cover go test ./... above; the
      # runner's own Node.js is enough.
      - name: The intake page seals, Go opens
        if: matrix.part == 'network'
        run: |
          dir=$(mktemp -d)
          node intake/testdata/fixtures.mjs "$dir"
          INTAKE_FIXTURES="$dir" go test -count=1 -run 'FromThePage' ./intake/
      # The tests that fetch crates from crates.io (the Rust example, a build
      # with a dependency): out of go test ./... and never cached.
      - name: Network tests
        if: matrix.part == 'network'
        run: make test-net
      # Also after a failure: go test keeps only passes, so the next push runs
      # what failed and reuses the rest.
      - name: Save the Go cache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-test-${{ runner.os }}-${{ matrix.part }}-${{ github.run_id }}-${{ github.run_attempt }}

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  # The reader template (R-RDR-1..4): the agent copies it to make a module
  # that reads an outside service. Its rules run here on a fake host; the
  # node's builder builds it in tools/modbench's tests (make test-net).
  reader-template:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: wasm32-wasip1
          components: rustfmt, clippy
      - name: Format, lint and unit tests
        working-directory: examples/modules/reader-template
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --target wasm32-wasip1 -- -D warnings
          cargo test --locked

  # The reflex template (R-RUN-15..17): the agent copies it to make reflex
  # modules. Its rules run here on a fake host; the node's builder builds it
  # in the test job (make test-net runs TestTheReflexTemplate in modhost).
  reflex-template:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: wasm32-wasip1
          components: rustfmt, clippy
      - name: Format, lint and unit tests
        working-directory: examples/modules/reflex-template
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --target wasm32-wasip1 -- -D warnings
          cargo test --locked

  # The web template (R-HTTP-4, R-HTTP-5): the agent copies it to make a
  # module that serves a page on an edge's loopback. Its routing, escaping
  # and ring buffers run here on a fake host.
  web-template:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: wasm32-wasip1
          components: rustfmt, clippy
      - name: Format, lint and unit tests
        working-directory: examples/modules/web-template
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --target wasm32-wasip1 -- -D warnings
          cargo test --locked

  # The html2md module (ADR-0035) is committed as html2md.wasm; the test
  # job above runs its fixture tests against that file. This job rebuilds
  # it from the Rust sources with the pinned toolchain, runs the module's
  # own tests and the fixture tests against the rebuilt module, and checks
  # that the committed file is what the sources build.
  html2md:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Rust toolchain (modules/html2md/rust-toolchain.toml)
        working-directory: modules/html2md
        run: rustup toolchain install
      - name: Module format, lint and unit tests
        working-directory: modules/html2md
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Build the module
        run: make modules-html2md
      - name: Fixture tests against the rebuilt module
        run: go test -count=1 ./modules/html2md/... ./tools/modbench/...
      - name: The committed module matches its sources
        run: |
          git diff --quiet -- modules/html2md/html2md.wasm || {
            echo "::error::modules/html2md/html2md.wasm differs from a build of its sources; run make modules-html2md and commit it"
            exit 1
          }

  # A published intake page never changes (R-INT-3): its two copies keep the
  # hash in intake/published.sha256, and a listed version is never edited or
  # removed. It runs on every change, documentation included, since the
  # site's copy lives under docs/.
  intake-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Published versions are unchanged
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: scripts/check-intake-pages.sh "$BASE"

  # The one check master requires. It passes when every job above passed or
  # was skipped, so a documentation-only pull request can merge.
  ci:
    if: always()
    needs: [changes, test, lint, reader-template, reflex-template, web-template, html2md, intake-pages]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac
