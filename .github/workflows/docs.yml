name: Docs

# The documentation site (ADR-0084): Zensical builds docs/ as it is. A pull
# request that touches the docs runs a strict build, so a broken link or
# heading anchor fails the check; a push to master publishes the site on
# GitHub Pages. This check is not required by master, so a paths filter on
# pull requests is safe here (see ci.yml for why CI cannot have one).
on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push to master replaces a queued one.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

env:
  # Pinned: Zensical is a beta (0.1), and an upgrade is a deliberate change
  # checked by the strict build. The same mkdocs.yml builds with
  # mkdocs-material 9.x if Zensical has to be dropped (ADR-0084).
  ZENSICAL_VERSION: "0.1.1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install "zensical==${ZENSICAL_VERSION}"
      - run: zensical build --clean --strict
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
