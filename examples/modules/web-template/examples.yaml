# Examples the node runs on the built module before you install it
# (module.build does it). Each example starts from an empty state; a step
# delivers an event to a port the manifest accepts:
#   trigger: {event: <port>, payload: <value>, from: <module>.<port>}
# `expect: {messages: 0}` counts what reached the owner; a page never writes
# to the owner, so it is always 0, and a step that fails the module is a
# failed example.
#
# The trial run delivers events and calls but does not yet send an HTTP
# request, so the routes, the answers and the escaping are tested by
# `cargo test` (src/lib.rs); these examples check that the built module takes
# what its ports accept and keeps its state. Change them with the ports.
examples:
  - name: readings are kept
    steps:
      - trigger: {event: reading, payload: {value: 12.5}, from: feed.reading}
        expect: {messages: 0}
      - after: 5m
        trigger: {event: reading, payload: {value: 13}, from: feed.reading}
        expect: {messages: 0}

  - name: notices are kept
    steps:
      - trigger: {event: notices, payload: {text: "battery is low", at: "2026-11-23T10:00:00Z"}, from: alerts.notify}
        expect: {messages: 0}
      - trigger: {event: notices, payload: {text: "battery is full", at: "2026-11-23T11:00:00Z"}, from: alerts.notify}
        expect: {messages: 0}

  - name: markup in a notice is only text
    steps:
      - trigger: {event: notices, payload: {text: "<script>alert(1)</script><img src=x onerror=alert(2)>", at: "now"}, from: alerts.notify}
        expect: {messages: 0}

  - name: a configured heading and ring are accepted
    config: {title: "Battery", max_points: "10", keep_hours: "6"}
    steps:
      - cells: {producer.value: 42}
        trigger: {event: reading, payload: {value: 42}, from: feed.reading}
        expect: {messages: 0}
