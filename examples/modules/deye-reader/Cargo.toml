[package]
name = "deye-reader"
version = "0.1.0"
edition = "2024"
description = "The deye-reader module: Deye inverter readings from DeyeCloud as ganglion cells (spec R-DEYE-1..3)"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
base64 = "0.23"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
