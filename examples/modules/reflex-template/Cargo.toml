[package]
name = "reflex-template"
version = "0.1.0"
edition = "2024"
description = "The reflex template: a module that reacts to cells and writes to the owner (spec R-RUN-15..17)"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
