[package]
name = "reader-template"
version = "0.1.0"
edition = "2024"
description = "The reader template: a module that reads an outside service on a schedule and reports cells (spec R-RDR-1..4)"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
