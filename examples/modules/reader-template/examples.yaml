# Examples the node runs on the built module before you install it
# (module.build does it). The network is not reached: `http` gives the
# answer to each exact URL, and `secrets` are fake values. Change these when
# you change logic.rs.
#
# The node's virtual time starts at the build, so a reading's `ts` is judged
# against that time: a `ts` far in the future counts as fresh, an old one as
# stale.
examples:
  - name: a reading is reported to the cells
    config: {station: roof-1}
    secrets: {API_TOKEN: fake}
    http:
      - url: https://api.example.com/v1/stations/roof-1/latest
        status: 200
        body: '{"ts": 4102444800, "value": 21.5, "online": true}'
    steps:
      - trigger: cron
        expect:
          reports: [reader-template.value, reader-template.online, reader-template.sample]

  - name: the status tool answers a fresh reading
    config: {station: roof-1}
    secrets: {API_TOKEN: fake}
    http:
      - url: https://api.example.com/v1/stations/roof-1/latest
        status: 200
        body: '{"ts": 4102444800, "value": 21.5, "online": true}'
    steps:
      - trigger: {tool: status, args: {}}

  - name: an old reading is stale and reports nothing
    config: {station: roof-1}
    secrets: {API_TOKEN: fake}
    http:
      - url: https://api.example.com/v1/stations/roof-1/latest
        status: 200
        body: '{"ts": 1793000000, "value": 21.5, "online": true}'
    steps:
      - trigger: cron
        expect: {fails: true, reports: []}

  - name: a server error fails the read
    config: {station: roof-1}
    secrets: {API_TOKEN: fake}
    http:
      - url: https://api.example.com/v1/stations/roof-1/latest
        status: 500
        body: ""
    steps:
      - trigger: cron
        expect: {fails: true}

  - name: a refused token fails the read
    config: {station: roof-1}
    secrets: {API_TOKEN: fake}
    http:
      - url: https://api.example.com/v1/stations/roof-1/latest
        status: 401
        body: ""
    steps:
      - trigger: cron
        expect: {fails: true}
